name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build clang \
            libgmp-dev libgmpxx4ldbl libboost-dev \
            libc++-dev libc++abi-dev zstd
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - run: lake build

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: brew install gmp boost cmake || true
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - run: lake build

  # Standalone Windows build. `SoplexFFI`'s build needs `MINGW_PREFIX`
  # to stage its vendored archives, so every step that reaches `lake`
  # must run under the MSYS2 MINGW64 shell; `defaults.run.shell` does
  # that for any step that does not override it.
  windows:
    name: Windows (MSYS2 / mingw-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-boost
            git
            unzip
      - name: Install elan and Lean toolchain
        run: |
          set -e
          export USERPROFILE="$(cygpath -w "$HOME")"
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -o elan-init.zip
          unzip -q elan-init.zip
          MSYS2_ARG_CONV_EXCL="*" ./elan-init.exe -y --default-toolchain none --no-modify-path
          ELAN_DIR_MSYS="$(cygpath -u "$USERPROFILE")/.elan"
          echo "$ELAN_DIR_MSYS/bin" > .elan-path
          echo "$MINGW_PREFIX/bin" >> .elan-path
          export PATH="$ELAN_DIR_MSYS/bin:$MINGW_PREFIX/bin:$PATH"
          # honor lean-toolchain
          elan toolchain install $(cat lean-toolchain)
          lean --version
      - name: Build
        run: |
          set -e
          export PATH="$(paste -sd: .elan-path):$PATH"
          lake build
